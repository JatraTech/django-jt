[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-jt"
version = "0.3.1"
description = "JatraTech Django toolkit: Auth901 OIDC and Casdoor user sync, DRF helpers (pagination, filters, proximity ordering, XLSX export, analytics), Postmaster/Gmail/Graph email, model mixins, encrypted fields, and request-ID middleware."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JatraTech" }]
dependencies = [
    "Django>=4.2",
]

[project.urls]
Repository = "https://github.com/JatraTech/django-jt"

[project.optional-dependencies]
models = ["django-userforeignkey"]
crypto = ["cryptography"]
rest = ["djangorestframework", "django-filter", "requests"]
email = ["requests"]
errors = ["drf-standardized-errors"]
oidc = ["mozilla-django-oidc"]
analytics = ["pydantic>=2", "polars>=1.34", "styleframe>=4.2"]
all = [
    "django-userforeignkey",
    "cryptography",
    "djangorestframework",
    "django-filter",
    "requests",
    "drf-standardized-errors",
    "mozilla-django-oidc",
    "pillow>=11.0",
    "google-api-python-client>=2.184.0",
    "google-auth[pyopenssl]>=2.41.0",
    "google-auth-oauthlib>=1.2.0",
    "msal>=1.38.0",
    "pydantic>=2",
    "polars>=1.34",
    "styleframe>=4.2",
]
test = [
    "celery",
    "pytest",
    "pytest-django",
    "django-userforeignkey",
    "djangorestframework",
    "django-filter",
    "cryptography",
    "mozilla-django-oidc",
    "requests",
    "pillow>=11.0",
    "google-api-python-client>=2.184.0",
    "google-auth[pyopenssl]>=2.41.0",
    "google-auth-oauthlib>=1.2.0",
    "msal>=1.38.0",
    "pydantic>=2",
    "polars>=1.34",
    "styleframe>=4.2",
]

[dependency-groups]
dev = [
    "celery",
    "pytest",
    "pytest-django",
    "django-userforeignkey",
    "djangorestframework",
    "django-filter",
    "cryptography",
    "mozilla-django-oidc",
    "requests",
    "pillow>=11.0",
    "google-api-python-client>=2.184.0",
    "google-auth[pyopenssl]>=2.41.0",
    "google-auth-oauthlib>=1.2.0",
    "msal>=1.38.0",
    "pydantic>=2",
    "polars>=1.34",
    "styleframe>=4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
testpaths = ["tests"]
